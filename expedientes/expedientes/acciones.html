<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Acciones disponibles</title>
	<style>
		.campo {
			width: calc(33.33% - 20px);
			/* Ancho de cada campo para mostrar tres por fila con margen entre ellos */
		}
	</style>
</head>

<body>
	<div>

		<tr th:each="accion : ${acciones}">

			<div class="campo">
				<label for="nomAccion">Nombre acción</label>
				<input size="25px" type="text" th:disabled="true" id="nomAcc" name="accion.accionDto.nomAccion" th:value="${accion?.accionDto.nomAccion}">
			</div>

			<div class="campo">
				<label for="idAccion">Id acción:</label>
				<input size="5px" type="text" th:disabled="true" id="idAccion" name="accion.accionDto.idAccion" th:value="${accion.accionDto.idAccion}">
			</div>
			
			<div class="campo">
				<label for="codAccion">Cod acción</label>
				<input size="5px" type="text" th:disabled="true" id="numero" name="accion.accionDto.codAccion" th:value="${accion.accionDto.codAccion}">
			</div>
			<br>
			<br>

		</tr>
		
	</div>

</body>

</html>
