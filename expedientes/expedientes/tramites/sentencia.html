<section id="sentencia" class="card-container" sinacsec:permisos="'P_LECTURA'">
<header>
	<div class="card-container--left-icon"> 
		<img th:src="@{/static/images/gavel.svg}" alt="Sentencia">
	</div>
	<span>Sentencia</span>
</header>
<form action="#" th:action="@{/expedientes/}+${modeloTramite.expediente.idExp}"
		th:object="${modeloTramite.expediente}" name="expediente" enctype="multipart/form-data" id="expediente"
		method="post">
		<input hidden id="idPro" name="idPro" th:value="${modeloTramite.expediente.procedimientoDto.idPro}">
		<input type="hidden" id="accOpe" name="accOpe" th:value="${modeloTramite.accionesOperaciones}" />
		<input type="hidden" id="codAccion" name="codAccion" th:value="${modeloTramite.codAccion}" />
		<input type="hidden" id="urlEditarDocumento" th:value="${urlEditarDocumento}" name="urlEditarDocumento"></input>
    <div th:if="${modeloTramite.expediente.sentidoResolucion!=null}"
      id="motivoSentencia" style="display: block;">
      <small>
        <strong>Motivo sentencia:</strong>
        <span th:text="${modeloTramite.expediente.sentidoResolucion.nomLdvMae}" th:title="${modeloTramite.expediente.sentidoResolucion}"></span>
      </small>
    </div>
		<div th:if="${modeloTramite.existeSentencia && modeloTramite.expediente.sentidoResolucion==null}"
			id="motivoResolucion" style="display: block;">
			<div class="col-sm-6">
				<select th:field="${modeloTramite.codMotivoSentenciaSeleccionado}" class="form-control w-100">
					<option
						th:each="sentencia : ${@componentesComunesService.getComboDtoByCodLdvEntidadMaestra('TIP_SN')}"
						th:text="${sentencia.valorCampoDesplegable}" th:value="${sentencia.idCampoDesplegable}" />
				</select>
				<label>Motivo Sentencia</label>
			</div>
			<div id="botonResolver" class="d-grid gap-2 d-md-flex justify-content-md-start">
				<button type="button"
					th:attr="onclick=|parameterMap.set('pftoa', '${modeloTramite.accionesOperaciones.get('RSOJ')?.get('RSE')}');
														ajaxLoadForm('${url}/expedientes/${modeloTramite.expediente.idExp}/sentencia', 'POST', 'expediente',new Array('main-sinac'), true);|"
					class="primary">Guardar Sentencia</button>
			</div>
		</div>
		<div th:if="${modeloTramite.accionesOperaciones.get('EJSE')?.get('ERC') != null}">
			<div id="botonSentencia" class="d-grid gap-2 d-md-flex justify-content-md-start">
				<button type="button"
					th:attr="onclick=|parameterMap.set('pftoa', '${modeloTramite.accionesOperaciones.get('EJSE')?.get('ERC')}');										
														ajaxLoadForm('${url}/expedientes/${modeloTramite.expediente.idExp}/sentencia', 'POST', 'expediente', new Array('main-sinac'), true);|"
					class="primary">Ejecutar Sentencia</button>
			</div>
		</div>
		<div id="tablaDocumentos" style="display: block;">
			<table id="tablaDocumentosAcuerdoIncoacion" aria-describedby="Documentos Acuerdo Incoacion" class="my-2">
				<thead>
					<tr>
						<th scope="col">
							<span>Documento</span>
						</th>
						<th scope="col">
							<span>Estado</span>
						</th>
						<th scope="col">
							<span>Fecha creación</span>
						</th>
						<th scope="col">
							<span>Fecha envío a firma</span>
						</th>
						<th scope="col">
							<span>Fecha firma</span>
						</th>
						<th scope="col"></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="documento, iterStat :${modeloTramite.tablaDocumentos}">
						<input hidden th:id="|idPlantilla${iterStat.index}|" th:name="|idPlantilla${iterStat.index}|"
							th:value="${documento.idPla}">
						<input hidden th:id="|idExpDoc${iterStat.index}|" th:name="|idExpDoc${iterStat.index}|"
							th:value="${documento.idExpDoc}">
						<td><span th:text="${documento.nomDocumento}" id="nombreDocumento"
								name="nombreDocumento"></span></td>
						<td>
							<div th:unless="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-NRE'}"
								class="tag-container"
								th:id="${documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-FIR' ? 'checked' : 'info'}">
								<img th:src="@{/static/images/document_denied-16-grey.svg}" alt="Estado del documento"
									th:if="${documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-FRE'}">
								<img th:src="@{/static/images/document_forward-16-grey.svg}" alt="Estado del documento"
									th:if="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-ENF'}">
								<img th:src="@{/static/images/document_checked-16-grey.svg}" alt="Estado del documento"
									th:if="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-FIR'}">
								<img th:src="@{/static/images/preliminary.svg}" alt="Estado del documento"
									th:if="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-PVA'}">
								<img th:src="@{/static/images/check_circle-black.svg}" alt="Estado del documento"
									th:if="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-VAL'}">
								<img th:src="@{/static/images/warning-black.svg}" alt="Alerta"
									th:if="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-NRE'}">
								<span th:if="${documento.estadoDocumento}"
									th:text="${documento.estadoDocumento!= null ? documento.estadoDocumento.nomLdvMae : '-'}"
									th:value="${documento.estadoDocumento.codLdvMae}" id="estadoDocumento"
									name="estadoDocumento">
								</span>
								<span th:unless="${documento.estadoDocumento}" value="pendienteGenerar"
									id="estadoDocumento" name="estadoDocumento">Pendiente de generar</span>
							</div>
							<div th:if="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-NRE'}"
								class="tag-container" th:id="alert">
								<img th:src="@{/static/images/warning-black.svg}" alt="Alerta">
								<span th:if="${documento.estadoDocumento}"
									th:text="${documento.estadoDocumento!= null ? documento.estadoDocumento.nomLdvMae}"
									th:value="${documento.estadoDocumento.codLdvMae}" id="estadoDocumento"
									name="estadoDocumento">
							</div>
						</td>
						<td>
							<span th:text="${documento.fechaCreacionDocumento}"></span>
						</td>
						<td>
							<span th:text="${documento.fechaEnvioFirmaDocumento}"></span>
						</td>
						<td>
							<span th:text="${documento.fechaFirmaDocumento}"></span>
						</td>
						<td>
							<div class="d-flex" sinacsec:permisos="'P_TRAMITA'">
								<div class="d-flex">
									<button
										th:if="${(documento.estadoDocumento == null or documento.estadoDocumento.codLdvMae == 'EDOC-FRE') and modeloTramite.accionesOperaciones?.get('GEND')?.get('GOA') != null && documento.codDocTipo == 'OFRAB'}"
										type="button" class="tertiary ms-auto" th:data-parameter1="${idExp}"
										th:data-parameter2="${documento.idPla}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('GEND')?.get('GOA')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('GEND')?.get('GOA')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idPlantilla${iterStat.index}'])|">
										<img th:src="@{/static/images/add_notes.svg}" alt="Generación de plantilla">
									</button>
									<button
										th:if="${(documento.estadoDocumento == null or documento.estadoDocumento.codLdvMae == 'EDOC-FRE') and modeloTramite.accionesOperaciones?.get('GEND')?.get('GAC') != null && documento.codDocTipo != 'OFRAB'}"
										type="button" class="tertiary ms-auto" th:data-parameter1="${idExp}"
										th:data-parameter2="${documento.idPla}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('GEND')?.get('GAC')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('GEND')?.get('GAC')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idPlantilla${iterStat.index}'])|">
										<img th:src="@{/static/images/add_notes.svg}" alt="Generación de plantilla">
									</button>
									<button
										th:if="${documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-BOR' and modeloTramite.accionesOperaciones?.get('FSEL')?.get('FAC') == null}"
										type="button" th:data-parameter1="${modeloTramite.idExp}"
										th:data-parameter2="${documento.idExpDoc}"
										th:data-parameter3="${modeloTramite.codTramite}" class="tertiary"
										th:onclick="getDocumentoUrl(this.getAttribute('data-parameter1'),this.getAttribute('data-parameter2'),this.getAttribute('data-parameter3'))">
										<img th:src="@{/static/images/edit.svg}" alt="Edición de plantilla"></button>
									<button
										th:if="${(documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-BOR') and modeloTramite.accionesOperaciones?.get('EPFI')?.get('FDR') != null and documento.codTFirmaLdv != 'TFIR-NFI' && documento.codDocTipo != 'OFRAB'}"
										type="button" class="tertiary" th:data-parameter1="${documento.idExpDoc}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('EPFI')?.get('FDR')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('EPFI')?.get('FDR')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idExpDoc${iterStat.index}'])|">
										<img th:src="@{/static/images/document_forward-16-blue.svg}"
											alt="Envío a firma">
									</button>
									<button
										th:if="${(documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-BOR') and modeloTramite.accionesOperaciones?.get('EPFI')?.get('FOA') != null and documento.codTFirmaLdv != 'TFIR-NFI' && documento.codDocTipo == 'OFRAB'}"
										type="button" class="tertiary" th:data-parameter1="${documento.idExpDoc}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('EPFI')?.get('FOA')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('EPFI')?.get('FOA')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idExpDoc${iterStat.index}'])|">
										<img th:src="@{/static/images/document_forward-16-blue.svg}"
											alt="Envío a firma">
									</button>
									<button
										th:if="${(documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-BOR') and modeloTramite.accionesOperaciones?.get('FSEL')?.get('FAC') != null && documento.codDocTipo != 'OFRAB'}"
										type="button" class="tertiary" th:data-parameter1="${documento.idExpDoc}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('FSEL')?.get('FAC')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('FSEL')?.get('FAC')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idExpDoc${iterStat.index}'])|">
										<img th:src="@{/static/images/document_forward-16-blue.svg}"
											alt="Firmar sello organo">
									</button>

									<button type="button" class="tertiary"
										th:if="${(documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-FIR') and modeloTramite.accionesOperaciones.get('CORC')?.get('COA') != null && documento.codDocTipo == 'OFRAB'}"
										th:data-parameter1="${documento.idExpDoc}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('CORC')?.get('COA')}"
											th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('CORC')?.get('COA')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idPlantilla${iterStat.index}'])|"><img
											th:src="@{/static/images/forward_to_inbox-18-blue.svg}"
											alt="Comunicar documento"></button>
								</div>

								<button
									th:if="${documento.expedienteDocumentoDto != null and documento?.estadoDocumento?.codLdvMae != 'EDOC-NRE' and documento.estadoDocumento != 'pendienteGenerar'}"
									type="button" onclick="menuDesplegable(this)" id="menuButton"
									class="tertiary ms-auto" th:disabled="${documento.estadoDocumento == null}"><img
										th:src="@{/static/images/more_vert.svg}" alt="Más opciones"></button>
								<span id="expedienteDocumento" hidden th:value="${documento.estadoDocumento}"></span>
							</div>
							<div id="menu" class="menu">
								<div th:if="${documento.expedienteDocumentoDto != null }">
									<button type="button" class="tertiary" id="abrirDetalleDoc"
										th:attr="onclick=|abrirModal('${documento.idExpDoc}')|"><img
											th:src="@{/static/images/find_in_page.svg}" alt="Modal del detalle">
										Ver detalle</button>
									<dialog th:id="'modal' + ${documento.idExpDoc}">
										<th:block
											th:insert="~{fragments/detalleDocumento :: detalleDocumento('formAcuerdoConsejoMinistros', (${documento.expedienteDocumentoDto}))}">
										</th:block>
									</dialog>
								</div>
								<button type="button" th:data-parameter1="${modeloTramite.idExp}"
									th:data-parameter2="${documento.idExpDoc}"
									th:onclick="descargarDocumentoOriginal(this.getAttribute('data-parameter1'), this.getAttribute('data-parameter2'))"
									class="tertiary"><img th:src="@{/static/images/download.svg}"
										alt="Descarga de documento">Descargar</button>
								<button type="button" th:if="${documento.expedienteDocumentoDto?.codGd != null}"
									th:data-parameter1="${modeloTramite.idExp}"
									th:data-parameter2="${documento.idExpDoc}"
									th:onclick="descargarDocumentoCopiaAutentica(this.getAttribute('data-parameter1'),this.getAttribute('data-parameter2'));"
									class="tertiary"><img th:src="@{/static/images/file_save.svg}"
										alt="Descarga de copia auténtica">Descargar copia auténtica</button>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</form>
	<form action="#" id="formularioEditarDocumento" name="formularioEditarDocumento" method="get">
	</form>
</section>
<br /><br />
