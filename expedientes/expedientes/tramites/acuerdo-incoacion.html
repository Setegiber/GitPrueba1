<section class="card-container" sinacsec:permisos="'P_LECTURA'">
	<header>Acuerdo incoación</header>
	<form th:action="@{/expedientes/{idExp}/tramite/AIN/(idExp=${modeloTramite.idExp})}" th:object="${modeloTramite}"
		id="formAcuerdoIncoacion" method="post">
		<input type="hidden" th:value="${modeloTramite.idExp}" id="idExp"></input>
		<input type="hidden" th:value="${modeloTramite.listaEstadosExp}" id="listaEstadosExp"></input>
		<input type="hidden" th:value="${modeloTramite.accionesOperaciones}" id="acciones"></input>
		<input type="hidden" id="urlEditarDocumento" th:value="${urlEditarDocumento}" name="urlEditarDocumento"></input>
		<input type="hidden" th:field="${modeloTramite.expediente.procedimientoDto.idPro}"
			th:name="procedimientoDto.idPro">
		<input hidden id="generarDocumento" name="generarDocumento" value="Requerimiento">
		<input hidden id="generarDocumentoOficio" name="generarDocumento" value="Oficio">
		<span id="errorValidator" class="error-validator" name="errorAcuerdoIncoacion" hidden></span>
		<div id="documentosAcuerdo" class="card-container">
			<div class="d-flex my-2" sinacsec:permisos="'P_TRAMITA'">
				<button type="button" class="tertiary ms-auto" id="descargarDocumentos"
					title="Descargar los documentos seleccionado"
					th:onclick="descargarDocumentosMultipleConsejoMinistros()">Descargar
					<img th:src="@{/static/images/download.svg}" alt="Descarga">
				</button>
				<button type="button" id="botonSubsanacion" class="secondary"
					title="Marcar como no subsanado el documento Notificacion interesado incoacion"
					th:if="${modeloTramite.accionesOperaciones.get('MSUB')?.get('SAIN') != null}"
					th:attr="onclick=|abrirModal('SubsanarNotificacionInteresado')|">
					Incoación subsanada
					<img src="/sinac-core/static/images/check_circle-blue.svg" alt="Subsanado" />
				</button>
				<button type="button" id="botonNoSubsanacion" class="secondary"
					title="Marcar como no subsanado el documento Notificacion interesado incoacion"
					th:if="${modeloTramite.accionesOperaciones.get('MNSU')?.get('SAIN') != null}"
					th:attr="onclick=|abrirModal('AvisoConfirmacion')|">
					Incoación no subsanada
					<img src="/sinac-core/static/images/cancel-blue.svg" alt="NoSubsanado" />
				</button>
				<button th:if="${modeloTramite.accionesOperaciones.get('GEND')?.get('GAIN')}" class="primary"
					id="generarDocumentos" type="button" title="Generar plantilla de los documentos seleccionado"
					sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('GEND')?.get('GAIN') != null}"
					th:attr="onclick=|accionMultipleDocumentosAcuerdoConsejoMinistros(${modeloTramite.accionesOperaciones?.get('GEND')?.get('GAIN')}, 
						'${modeloTramite.idExp}', '${modeloTramite.codTramite}', 'generarDocumento')|">
					Generar plantilla
					<img src="/sinac-core/static/images/add_notes-20-white.svg" alt="Generar plantilla" />
				</button>
				<button th:if="${modeloTramite.accionesOperaciones.get('EPFI')?.get('FAIN') != null}" class="primary"
					title="Enviar a firma los documentos seleccionados" id="enviarDocumentosFirma" type="button"
					th:attr="onclick=|accionMultipleDocumentosAcuerdoConsejoMinistros('${modeloTramite.accionesOperaciones.get('EPFI').get('FAIN')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', 'enviarPortafirmas')|">
					Enviar a firma
					<img th:src="@{/static/images/document_forward-16-white.svg}" alt="Enviar a firma">
				</button>
				<!--Como recoger el idExpDoc de Ineficacia Oficio RC incoación
			<button type="button" class="primary" id="comunicarDocumentoIncoacion"
				title="Comunicar documento Ineficacia Oficio RC incoación a Registro Civil"
				th:if="${modeloTramite.accionesOperaciones.get('CORC')?.get('CAIN') != null}"
				th:attr="onclick=|comunicarOficioRCIncoacion('${modeloTramite.accionesOperaciones?.get('CORC')?.get('CAIN')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', 'tablaDocumentosAcuerdoIncoacion')|">
				Comunicar Ineficacia Oficio RC incoación
				<img th:src="@{/static/images/forward_to_inbox-16-white.svg}" alt="Comunicar documento">
			</button>-->
			</div>
			<span id="errorValidator" class="error-validator" name="errorAcuerdoIncoacion" hidden></span>
			<table id="tablaDocumentosAcuerdoIncoacion" aria-describedby="Documentos Acuerdo Incoacion">
				<thead>
					<tr>
						<th scope="col"><span><input type="checkbox" id="checkboxMarcarTodos" name="checkboxMarcarTodos"
									th:onchange="marcarDesmarcarCheckboxes()"></span></th>
						<th scope="col">
							<span>Documento</span>
						</th>
						<th scope="col">
							<span>Estado</span>
						</th>
						<th scope="col">
							<span>F. creación</span>
						</th>
						<th scope="col">
							<span>F. envío a firma</span>
						</th>
						<th scope="col">
							<span>F. firma</span>
						</th>
						<th scope="col"></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="documento, iterStat :${modeloTramite.tablaDocumentos}">
						<input hidden th:id="|idPlantilla${iterStat.index}|" th:name="|idPlantilla${iterStat.index}|"
							th:value="${documento.idPla}">
						<input hidden th:id="|idExpDoc${iterStat.index}|" th:name="|idExpDoc${iterStat.index}|"
							th:value="${documento.idExpDoc}">
						<td>
							<input th:if="${documento.nomDocumento}" th:value="${documento.idExpDoc}" type="checkbox"
								id="checkboxDocumentoAcuerdo" class="idDocsGenerados" name="agregarDocumento"
								th:data-parameter1="${documento.nomDocumento}"
								th:data-parameter2="${documento.codTFirmaLdv}"
								th:data-parameter3="${documento.estadoDocumento != null ? documento.estadoDocumento.codLdvMae : null}"
								th:data-parameter4="|idPlantilla${iterStat.index}|"
								th:data-parameter5=|idExpDoc${iterStat.index}|
								th:data-parameter6="${documento.codDocTipo}" />
						</td>
						<td><span th:text="${documento.nomDocumento}" id="nombreDocumento"
								name="nombreDocumento"></span>
						</td>
						<td>
							<div th:unless="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-NRE'}"
								class="tag-container"
								th:id="${documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-FIR' ? 'checked' : 'info'}">
								<img th:src="@{/static/images/document_denied-16-grey.svg}" alt="Estado del documento"
									th:if="${documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-FRE'}">
								<img th:src="@{/static/images/document_forward-16-grey.svg}" alt="Estado del documento"
									th:if="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-ENF'}">
								<img th:src="@{/static/images/document_checked-16-grey.svg}" alt="Estado del documento"
									th:if="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-FIR'}">
								<img th:src="@{/static/images/preliminary.svg}" alt="Estado del documento"
									th:if="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-PVA'}">
								<img th:src="@{/static/images/check_circle-black.svg}" alt="Estado del documento"
									th:if="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-VAL'}">
								<img th:src="@{/static/images/warning-black.svg}" alt="Alerta"
									th:if="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-NRE'}">
								<span th:if="${documento.estadoDocumento}"
									th:text="${documento.estadoDocumento!= null ? documento.estadoDocumento.nomLdvMae : '-'}"
									th:value="${documento.estadoDocumento.codLdvMae}" id="estadoDocumento"
									name="estadoDocumento">
								</span>
								<span th:unless="${documento.estadoDocumento}" value="pendienteGenerar"
									id="estadoDocumento" name="estadoDocumento">Pendiente de generar</span>
							</div>
							<div th:if="${documento.estadoDocumento != null and documento.estadoDocumento?.codLdvMae == 'EDOC-NRE'}"
								class="tag-container" th:id="alert">
								<img th:src="@{/static/images/warning-black.svg}" alt="Alerta">
								<span th:if="${documento.estadoDocumento}"
									th:text="${documento.estadoDocumento!= null ? documento.estadoDocumento.nomLdvMae : '-'}"
									th:value="${documento.estadoDocumento.codLdvMae}" id="estadoDocumento"
									name="estadoDocumento">
							</div>
						</td>
						<td>
							<span th:text="${documento.fechaCreacionDocumento}"></span>
						</td>
						<td>
							<span th:text="${documento.fechaEnvioFirmaDocumento}"></span>
						</td>
						<td>
							<span th:text="${documento.fechaFirmaDocumento}"></span>
						</td>
						<td
							th:if="${documento?.estadoDocumento == null or documento?.estadoDocumento?.codLdvMae != 'EDOC-NRE'}">
							<div class="d-flex" sinacsec:permisos="'P_TRAMITA'">
								<div class="d-flex">
									<input type="hidden" th:value="${documento.codPlantilla}" name="codPlantilla"
										id="codPlantilla"></input>
									<input type="hidden" th:value="${modeloTramite.idExpReq}" name="idExpReq"
										id="idExpReq"></input>
									<button th:if="${(documento.estadoDocumento == null or documento.estadoDocumento.codLdvMae == 'EDOC-FRE') 
										and modeloTramite.accionesOperaciones?.get('GEND')?.get('GAIN') != null 
										and documento.codPlantilla != null and documento.codPlantilla != 'NOTINTIN'}" type="button"
										class="tertiary ms-auto" th:data-parameter1="${idExp}"
										th:data-parameter2="${documento.idPla}"
										th:title="|Generar plantilla del documento ${documento.nomDocumento}|"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('GEND')?.get('GAIN')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('GEND')?.get('GAIN')}', 
										'${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idPlantilla${iterStat.index}'])|">
										<img th:src="@{/static/images/add_notes.svg}" alt="Generación de plantilla">
									</button>

									<button id="buttonGenerar" type="button" class="tertiary ms-auto" th:if="${documento.estadoDocumento == null and modeloTramite.accionesOperaciones?.get('GEND')?.get('GAIN') != null
										and documento.codPlantilla != null and documento.codPlantilla == 'NOTINTIN'}"
										th:title="|Generar requerimiento del documento ${documento.nomDocumento}|"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('GEND')?.get('GAIN')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('GEND')?.get('GAIN')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idPlantilla${iterStat.index}', 'generarDocumento'])|">
										<img th:src="@{/static/images/add_notes.svg}" alt="Generación de requerimiento">
									</button>

									<button
										th:if="${documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-BOR'}"
										th:title="|Edición de la plantilla del documento ${documento.nomDocumento}|"
										type="button" th:data-parameter1="${modeloTramite.idExp}"
										th:data-parameter2="${documento.idExpDoc}"
										th:data-parameter3="${modeloTramite.codTramite}" class="tertiary"
										th:onclick="getDocumentoUrl(this.getAttribute('data-parameter1'),this.getAttribute('data-parameter2'),this.getAttribute('data-parameter3'))">
										<img th:src="@{/static/images/edit.svg}" alt="Edición de plantilla"></button>
									<button
										th:if="${(documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-BOR') and modeloTramite.accionesOperaciones?.get('EPFI')?.get('EAIN') != null and documento.codTFirmaLdv != 'TFIR-NFI'}"
										type="button" class="tertiary" th:data-parameter1="${documento.idExpDoc}"
										th:title="|Enviar a firma el documento ${documento.nomDocumento}|"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('EPFI')?.get('EAIN')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('EPFI')?.get('EAIN')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idExpDoc${iterStat.index}'])|">
										<img th:src="@{/static/images/document_forward-16-blue.svg}"
											alt="Envío a firma">
									</button>
									<button type="button" id="buttonEnviarAFirma" class="tertiary ms-auto"
										th:title="|Enviar a firma el requerimiento ${documento.nomDocumento}|" th:if="${(documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-BOR') and modeloTramite.accionesOperaciones?.get('EPFI')?.get('FAIN') != null and documento.codTFirmaLdv != 'TFIR-NFI'
									and documento.codPlantilla != null and documento.codPlantilla == 'NOTINTIN'}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('EPFI')?.get('FAIN')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('EPFI')?.get('FAIN')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idExpDoc${iterStat.index}', 'idExpReq'])|">
										<img src="/sinac-core/static/images/document_forward-16-blue.svg"
											alt="Enviar requerimiento a firma" />
									</button>
									<button
										th:if="${(documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-FIR') and modeloTramite.accionesOperaciones?.get('CORC')?.get('EARC') != null and documento.codTFirmaLdv != 'TFIR-NFI'}"
										type="button" class="tertiary" th:data-parameter1="${documento.idExpDoc}"
										th:title="|Enviar a Registro Civil el documento ${documento.nomDocumento}|"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('CORC')?.get('EARC')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('CORC')?.get('EARC')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idExpDoc${iterStat.index}'])|">
										<img th:src="@{/static/images/document_forward-16-blue.svg}" alt="Envío a RC">
									</button>
									<button
										th:if="${(documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-FIR') and modeloTramite.accionesOperaciones?.get('CDGP')?.get('EDGP') != null and documento.codTFirmaLdv != 'TFIR-NFI'}"
										th:title="|Enviar a DGP el documento ${documento.nomDocumento}|" type="button"
										class="tertiary" th:data-parameter1="${documento.idExpDoc}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('CDGP')?.get('EDGP')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('CDGP')?.get('EDGP')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idExpDoc${iterStat.index}'])|">
										<img th:src="@{/static/images/document_forward-16-blue.svg}" alt="Envío a DGP">
									</button>
									<button th:if="${(documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-BOR') and modeloTramite.accionesOperaciones?.get('EPFI')?.get('FAIN') != null and documento.codTFirmaLdv != 'TFIR-NFI'
									and documento.codPlantilla != null and documento.codPlantilla != 'NOTINTIN'}"
										th:title="|Enviar a firma el documento ${documento.nomDocumento}|" type="button"
										class="tertiary ms-auto" th:data-parameter1="${documento.idExpDoc}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('EPFI')?.get('FAIN')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('EPFI')?.get('FAIN')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idExpDoc${iterStat.index}'])|">
										<img th:src="@{/static/images/document_forward-16-blue.svg}"
											alt="Enviar a firma">
									</button>

									<button type="button" id="botonGenerarReqFre" class="tertiary ms-auto" th:if="${(documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-FRE') and modeloTramite.accionesOperaciones?.get('GEND')?.get('GAIN') != null
									and documento.codPlantilla != null and documento.codPlantilla == 'NOTINTIN'}"
										th:title="|Generar requerimiento tras firma rechazada del documento ${documento.nomDocumento}|"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('GEND')?.get('GAIN')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('GEND')?.get('GAIN')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idPlantilla${iterStat.index}', 'generarDocumentoOficio','idExpReq'])|">
										<img src="/sinac-core/static/images/add_notes.svg"
											alt="Generación de requerimiento" />
									</button>

									<button type="button" class="tertiary ms-auto"
										th:data-parameter1="${documento.idExpDoc}"
										th:title="|Enviar a notificar el requerimiento ${documento.nomDocumento}|"
										th:if="${documento.estadoDocumento != null and (documento.estadoDocumento.codLdvMae == 'EDOC-FIR' or documento.estadoDocumento.codLdvMae == 'EDOC-NER')
									and documento.codDocTipo != null and documento.codDocTipo == 'NIINC' and modeloTramite.accionesOperaciones.get('NDOC')?.get('NAIN') != null}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('NDOC')?.get('NAIN')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('NDOC')?.get('NAIN')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idExpDoc${iterStat.index}', 'idExpReq'])|"><img
											th:src="@{/static/images/notification_forward-18-blue.svg}"
											alt="Enviar requerimiento a notificar">
									</button>

									<button type="button" class="tertiary ms-auto"
										th:data-parameter1="${documento.idExpDoc}"
										th:title="|Comunicar documento ${documento.nomDocumento} a Registro Civil|"
										th:if="${(documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-FIR' and !modeloTramite.listaEstadosExp.contains('AIER')) 
									and documento.codDocTipo != null and documento.codDocTipo != 'NIINC' and documento.codDocTipo != 'AINCO' and modeloTramite.accionesOperaciones.get('CORC')?.get('CAIN') != null}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('CORC')?.get('CAIN')}"
										th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('CORC')?.get('CAIN')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['idExpDoc${iterStat.index}'])|"><img
											th:src="@{/static/images/forward_to_inbox-18-blue.svg}"
											alt="Comunicar documento">
									</button>

									<button type="button" id="botonSubsanacion" class="tertiary ms-auto"
										th:title="|Marcar como subsanado el documento ${documento.nomDocumento}|"
										th:if="${documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-NOT'
									and documento.codDocTipo != null and documento.codDocTipo == 'NIINC' and modeloTramite.accionesOperaciones.get('MSUB')?.get('SAIN') != null}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('MSUB')?.get('SAIN')}"
										th:attr="onclick=|abrirModal('SubsanarNotificacionInteresado')|">
										<img src="/sinac-core/static/images/check_circle-blue.svg" alt="Subsanado" />
									</button>
									<button type="button" id="botonNoSubsanacion" class="tertiary ms-auto"
										th:title="|Marcar como no subsanado el documento ${documento.nomDocumento}|"
										th:if="${documento.estadoDocumento != null and documento.estadoDocumento.codLdvMae == 'EDOC-NOT'
									and documento.codDocTipo != null and documento.codDocTipo == 'NIINC' and modeloTramite.accionesOperaciones.get('MNSU')?.get('SAIN') != null}"
										sinacsec:permiso-accion="${modeloTramite.accionesOperaciones?.get('MNSU')?.get('SAIN')}"
										th:attr="onclick=|abrirModal('AvisoConfirmacion')|">
										<img src="/sinac-core/static/images/cancel-blue.svg" alt="NoSubsanado" />
									</button>
								</div>

								<button
									th:if="${documento.expedienteDocumentoDto != null and documento?.estadoDocumento?.codLdvMae != 'EDOC-NRE' and documento.estadoDocumento != 'pendienteGenerar'}"
									type="button" onclick="menuDesplegable(this)" id="menuButton"
									class="tertiary ms-auto" th:disabled="${documento.estadoDocumento == null}">
									<img th:src="@{/static/images/more_vert.svg}" title="Más opciones"
										alt="Más opciones"></button>
								<span id="expedienteDocumento" hidden th:value="${documento.estadoDocumento}"></span>
								</button>
							</div>
							<div id="menu" class="menu">
								<div th:if="${documento.expedienteDocumentoDto != null }">
									<button type="button" class="tertiary" id="abrirDetalleDoc"
										th:title="|Ver detalle del documento ${documento.nomDocumento}|"
										th:attr="onclick=|abrirModal('${documento.idExpDoc}')|"><img
											th:src="@{/static/images/find_in_page.svg}" alt="Modal del detalle">
										Ver detalle</button>
									<dialog th:id="'modal' + ${documento.idExpDoc}">
										<th:block
											th:insert="~{fragments/detalleDocumento :: detalleDocumento('formAcuerdoConsejoMinistros', (${documento.expedienteDocumentoDto}))}">
										</th:block>
									</dialog>
								</div>
								<button type="button" th:data-parameter1="${modeloTramite.idExp}"
									th:data-parameter2="${documento.idExpDoc}"
									th:onclick="descargarDocumentoOriginal(this.getAttribute('data-parameter1'), this.getAttribute('data-parameter2'))"
									class="tertiary" th:title="|Descargar el documento ${documento.nomDocumento}|">
									<img th:src="@{/static/images/download.svg}"
