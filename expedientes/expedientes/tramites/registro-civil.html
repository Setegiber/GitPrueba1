<header style="
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    color: #074e8e;
    font-size: 23px;
    padding-left: 4px;
    /* line-height: 32px; */
    /* box-sizing: border-box; */
    padding-top: 24px;
">
	<div class="card-container--left-icon" style="
    box-sizing: border-box;
    line-height: 32px;
">
		<svg alt="Expediente en DIICIREG" width="20" height="16" viewBox="0 0 20 16" fill="none"
			xmlns="http://www.w3.org/2000/svg">
			<path
				d="M2 16C1.45 16 0.979167 15.8042 0.5875 15.4125C0.195833 15.0208 0 14.55 0 14V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H8L10 2H18C18.55 2 19.0208 2.19583 19.4125 2.5875C19.8042 2.97917 20 3.45 20 4V14C20 14.55 19.8042 15.0208 19.4125 15.4125C19.0208 15.8042 18.55 16 18 16H2ZM2 14H18V4H9.175L7.175 2H2V14Z"
				fill="#0F5DA3"></path>
		</svg>
	</div>
	<span>Expediente en DICIREG</span>
</header>
<form action="#" th:action="@{/expedientes/}+${modeloTramite.expediente.idExp}" th:object="${modeloTramite}"
	id="formEnviarDicireg" name="formEnviarDicireg" enctype="multipart/form-data" method="post">
	<input type="hidden" id="urlEditarDocumento" th:value="${urlEditarDocumento}" name="urlEditarDocumento"></input>
	<input type="hidden" id="acciones" name="acciones" th:value="${modeloTramite.accionesOperaciones}" />
	<input type="hidden" id="codTramite" name="codTramite" th:value="${modeloTramite.codTramite}" />
	<div th:if="${modeloTramite.accionesOperaciones?.get('CDIC')?.get('CDIC') == null && modeloTramite.codEstadoExpediente != null 			 
		&& !(modeloTramite.codEstadoExpediente.matches('PCRC|CRCC|EXCP|ARCE'))}">
		<p><span th:text="#{expediente.envioDicireg.mensajeDefault}"></span></p>
	</div>
	<div class="d-flex mt-2 mb-4" sinacsec:permisos="'P_TRAMITA'" th:if="${modeloTramite.accionesOperaciones?.get('CDIC')?.get('CDIC') != null
			&& modeloTramite.codEstadoExpediente == 'PCRC'}">
		<div id="divBotonComunicar" style="display: block;">
			<div id="botonComunicar" class="d-grid gap-2 d-md-flex justify-content-md-start">
				<button type="button" title="Comunicar devolución de tasas a la AEAT"
					th:attr="onclick=|ejecutaAccionTramitacion('${modeloTramite.accionesOperaciones?.get('CDIC')?.get('CDIC')}', '${modeloTramite.idExp}', '${modeloTramite.codTramite}', ['formEnviarDicireg'])|"
					class="primary">Enviar expediente a DICIREG</button>
			</div>
		</div>
	</div>
	<div th:if="${modeloTramite.codEstadoExpediente != null
					&& modeloTramite.codEstadoExpediente.matches('CRCC|EXCP|ARCE')}">
		<p><span th:text="#{expediente.envioDicireg.mensajeEnviadoDICIREG}"></span></p>
	</div>
	</div>
